name: watch_tv
description: An application to stream IPTV.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  get_it: ^7.6.4
  retrofit: ^4.0.3
  json_serializable: ^6.7.1
  shared_preferences: ^2.2.2
  pretty_dio_logger: ^1.3.1
  lints: ^3.0.0
  path_provider: ^2.1.1
  bloc: ^8.1.2
  flutter_bloc: ^8.1.3
  cached_network_image: ^3.3.0
  equatable: ^2.0.5
  dio: ^5.4.0
  flutter_svg: ^2.0.9
  intl: ^0.18.1
  connectivity_plus: ^5.0.2
  csv: ^5.1.1
  easy_localization: ^3.0.3
  json_annotation: ^4.8.1
  firebase_core: ^2.24.0
  cloud_firestore: ^4.13.3

dev_dependencies:
  build_runner: ^2.4.7
  retrofit_generator: ^8.0.4
  mockito: ^5.4.3
  bloc_test: ^9.1.5
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  flutter_flavorizr: ^2.2.1
  gen_res:
     git:
       url: https://github.com/nguyenvantuyen98/gen_res
       ref: dev

gen_res:
  output: lib/resources/
  generate_R: true

  drawable:
    enabled: true
    path: assets/images/

  fonts:
    enabled: true

  colors:
    enabled: false

flavorizr:
  ide: "vscode"
  flavors:
    dev:
      app:
        name: "Watch TV Dev"
      android:
        applicationId: "com.vkt.watch_tv.dev"
        generateDummyAssets: false
      ios:
        bundleId: "com.vkt.watch_tv.dev"
        generateDummyAssets: false

    stg:
      app:
        name: "Watch TV Staging"
      android:
        applicationId: "com.vkt.watch_tv.stg"
        generateDummyAssets: false
      ios:
        bundleId: "com.vkt.watch_tv.stg"
        generateDummyAssets: false

    prod:
      app:
        name: "Watch TV"
      android:
        applicationId: "com.vkt.watch_tv.prod"
        generateDummyAssets: false
      ios:
        bundleId: "com.vkt.watch_tv.prod"
        generateDummyAssets: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/langs.csv
  
  fonts:
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Light.ttf
        - asset: assets/fonts/Raleway-Medium.ttf
          style: italic